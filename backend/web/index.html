<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>廁所地圖</title>
  <script src="/web/theme.js?v=2"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="/web/styles.css?v=12">
</head>
<body>
  <header class="toolbar">
    <div class="toolbar-brand">
      <h1>
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M5 3h6v8H5z M11 11h8v2a5 5 0 0 1-5 5h-1l1 3H8l1-4a5 5 0 0 1-4-5v-1"/></svg>
        </span>
        廁所地圖
      </h1>
      <button id="show-data-source" type="button" aria-label="資料來源 · 環境部環境管理署"
        aria-haspopup="dialog" aria-controls="data-source">
        <span class="data-source-name">環境部環境管理署</span> <span aria-hidden="true">ⓘ</span>
      </button>
    </div>
    <div id="filters" class="filters" role="group" aria-label="篩選廁所">
      <details id="gender-menu" class="gender-menu">
        <summary id="gender-label" class="chip">性別</summary>
        <div class="gender-options">
          <button id="clear-gender" type="button">所有性別</button>
          <label><input type="checkbox" name="gender" value="men"> 男廁</label>
          <label><input type="checkbox" name="gender" value="women"> 女廁</label>
          <label><input type="checkbox" name="gender" value="gender_friendly"> 性別友善</label>
        </div>
      </details>
      <label class="chip"><input id="accessible" type="checkbox"> 無障礙</label>
      <label class="chip"><input id="diaper" type="checkbox"> 尿布台</label>
    </div>
    <button id="theme" class="theme-switch" type="button" role="switch"
      aria-label="深色模式" aria-checked="false" hidden>
      <svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/>
      </svg>
      <svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20.5 15A9 9 0 0 1 9 3.5 9 9 0 1 0 20.5 15Z"/>
      </svg>
    </button>
  </header>

  <main id="workspace" class="workspace" data-panel="nearby">
    <section class="map-area" aria-label="廁所地圖">
      <div id="map" role="group" aria-label="互動地圖"></div>
      <button id="locate" type="button" class="locate" aria-label="回到我的位置" title="回到我的位置">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3"/></svg>
      </button>
      <div id="startup" class="startup" role="status">
        <span class="spinner" aria-hidden="true"></span>
        正在載入附近廁所…
      </div>
    </section>
    <section id="nearby-panel" class="panel" aria-labelledby="nearby-title">
      <div id="panel-top">
        <header class="panel-head">
          <h2 id="nearby-title">附近廁所</h2>
          <p id="count" aria-live="polite"></p>
          <button id="panel-handle" type="button" aria-controls="list" aria-expanded="true">展開清單</button>
          <button id="show-all" type="button" hidden>顯示全部</button>
        </header>
        <div class="notices">
          <p id="status" role="status" hidden></p>
          <p id="location-status" role="status" hidden></p>
          <button id="retry" type="button" hidden>重試</button>
        </div>
      </div>
      <ul id="list" aria-label="附近廁所清單"></ul>
    </section>
  </main>

  <dialog id="data-source" aria-labelledby="data-source-title">
    <header class="dialog-head">
      <h2 id="data-source-title">資料來源與授權</h2>
      <form method="dialog"><button type="submit" autofocus>完成</button></form>
    </header>
    <div class="data-source-content">
      <p>公廁資料由環境部環境管理署提供，取自<a href="https://esms.moenv.gov.tw/eco/toilet/FindToilet.aspx?openExternalBrowser=1">環境衛生管理資訊系統公廁查詢</a>，經本服務整理與彙整。</p>
      <p><a href="https://data.gov.tw/dataset/30794">全國公廁建檔資料</a>依<a href="https://data.gov.tw/license">政府資料開放授權條款第 1 版</a>釋出。</p>
      <p><a href="https://www.moenv.gov.tw/announcement/publicdeclare/913.html">環境部網站資料開放宣告</a></p>
    </div>
  </dialog>

  <dialog id="details" aria-labelledby="details-title">
    <header class="dialog-head">
      <h2 id="details-title">廁所詳情</h2>
      <form method="dialog"><button type="submit" autofocus>完成</button></form>
    </header>
    <div id="details-content"></div>
  </dialog>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="/web/app.js?v=9"></script>
</body>
</html>
