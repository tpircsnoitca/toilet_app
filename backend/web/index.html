<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>廁所地圖</title>
  <script src="/web/theme.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="/web/styles.css">
</head>
<body>
  <header class="toolbar">
    <h1>廁所地圖</h1>
    <div id="filters" class="filters" role="group" aria-label="篩選廁所">
      <details id="gender-menu" class="gender-menu">
        <summary id="gender-label" class="chip">性別</summary>
        <div class="gender-options">
          <button id="clear-gender" type="button">所有性別</button>
          <label><input type="checkbox" name="gender" value="men"> 男廁</label>
          <label><input type="checkbox" name="gender" value="women"> 女廁</label>
          <label><input type="checkbox" name="gender" value="gender_friendly"> 性別友善</label>
        </div>
      </details>
      <label class="chip"><input id="accessible" type="checkbox"> 無障礙</label>
      <label class="chip"><input id="diaper" type="checkbox"> 尿布台</label>
    </div>
    <select id="theme" class="theme-picker" aria-label="外觀" hidden>
      <option value="system">跟隨系統</option>
      <option value="light">淺色模式</option>
      <option value="dark">深色模式</option>
    </select>
  </header>

  <main id="workspace" class="workspace" data-panel="nearby">
    <section class="map-area" aria-label="廁所地圖">
      <div id="map"></div>
      <button id="locate" type="button" class="locate" aria-label="回到我的位置" title="回到我的位置">◎</button>
      <div id="startup" class="startup" role="status">
        <div class="startup-symbols" aria-hidden="true"><span>🏃</span><span>🚽</span></div>
        正在載入附近廁所…
      </div>
    </section>
    <section class="panel" aria-labelledby="nearby-title">
      <header class="panel-head">
        <h2 id="nearby-title">附近廁所</h2>
        <button id="panel-toggle" type="button" aria-controls="list" aria-expanded="true">展開清單</button>
        <p id="count" aria-live="polite"></p>
        <button id="show-all" type="button" hidden>顯示全部</button>
      </header>
      <div class="notices">
        <p id="status" role="status" hidden></p>
        <p id="location-status" role="status" hidden></p>
        <button id="retry" type="button" hidden>重試</button>
      </div>
      <ul id="list" aria-label="附近廁所清單"></ul>
    </section>
  </main>

  <dialog id="details" aria-labelledby="details-title">
    <header class="dialog-head">
      <h2 id="details-title">廁所詳情</h2>
      <form method="dialog"><button type="submit" autofocus>完成</button></form>
    </header>
    <div id="details-content"></div>
  </dialog>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="/web/app.js"></script>
</body>
</html>
